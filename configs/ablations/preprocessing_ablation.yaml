# Preprocessing Ablation Study Configurations
# Compares 4 fundus enhancement modes:
# 1. raw_rgb: Unmodified RGB fundus image
# 2. raw_green: Green channel replicated across 3 channels
# 3. ben_graham_green: Gaussian background subtraction on Green channel (Champion)
# 4. clahe_green: Contrast Limited Adaptive Histogram Equalization on Green channel

modes:
  - "ben_graham_green"
  - "clahe_green"
  - "raw_green"
  - "raw_rgb"

global_img_size: 512
local_patch_size: 128
