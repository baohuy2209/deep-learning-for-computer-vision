experiment:
  name: "lodo_6fold_benchmark"
  seed: 42
  device: "cuda:0"
  output_dir: "results/lodo_benchmark"

lodo:
  folds_dir: "data/processed/lodo_folds"
  summary_csv: "data/processed/lodo_folds/lodo_splits_summary.csv"
  checkpoint_dir: "checkpoints/checkpoints_lodo"

model:
  architecture: "MultiScaleMILNet"
  global_branch:
    backbone: "efficientnet_b0"
    pretrained: true
    img_size: 512
    preprocessing: "ben_graham_green"
  local_branch:
    backbone: "efficientnet_b0"
    pretrained: true
    patch_size: 224
    num_patches: 4
  attention:
    type: "cbam"
  head:
    type: "consistent_ordinal"
    num_classes: 5

training:
  epochs: 30
  batch_size: 16
  mixed_precision: true
  optimizer:
    name: "AdamW"
    lr: 1.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 30
    eta_min: 1.0e-6
  early_stopping:
    monitor: "val_qwk"
    patience: 6
